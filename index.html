<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz do Cerrado - telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --noite: #15100a; --ouro: #f0b63c; --brilho: #ffe9a8; --areia: #f6ead2; --vereda: #3fa877; --barro: #d9512f; }
* { box-sizing: border-box; margin: 0; }
html { font-size: min(1vw, 1.78vh); }
body { background: var(--noite); color: var(--areia); font-family: Figtree, "Segoe UI", sans-serif; overflow: hidden; height: 100vh; cursor: default; user-select: none; }
.titulo, .perg, .nomeEtapa, .num { font-family: Fraunces, Georgia, serif; }
.bg { position: fixed; inset: -4%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.6s ease; animation: passeio 46s ease-in-out infinite alternate; }
.bg.on { opacity: 1; }
@keyframes passeio { from { transform: scale(1.02) translate(-1%, .6%); } to { transform: scale(1.13) translate(1.4%, -1%); } }
#motes { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#veu { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(21,16,10,.55) 0%, rgba(21,16,10,.12) 26%, rgba(21,16,10,.5) 58%, rgba(21,16,10,.93) 100%); transition: background 1s; }
body.forte #veu { background: linear-gradient(180deg, rgba(21,16,10,.74) 0%, rgba(21,16,10,.62) 40%, rgba(21,16,10,.93) 100%); }
#fio { position: fixed; left: 0; top: 0; height: .55rem; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--ouro), var(--brilho)); box-shadow: 0 0 1.6rem .3rem rgba(255,214,120,.75); opacity: 0; transition: opacity .4s; }
#fio.on { opacity: 1; }
#fio.fim { background: var(--barro); box-shadow: 0 0 1.6rem .3rem rgba(217,81,47,.8); }
#tela { position: fixed; inset: 0; padding: 4rem 5rem 3.4rem; display: flex; flex-direction: column; }
#credito { position: fixed; right: 1.2rem; bottom: .7rem; font-size: .95rem; opacity: .6; text-shadow: 0 1px 3px #000; }
#rede { position: fixed; left: 1.2rem; bottom: .7rem; font-size: .95rem; opacity: .7; text-shadow: 0 1px 3px #000; }
.sombra { text-shadow: 0 .15rem 1.2rem rgba(0,0,0,.75), 0 0 .2rem rgba(0,0,0,.6); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: .25rem solid var(--brilho); outline-offset: .3rem; }

/* abertura */
.abertura { flex: 1; display: grid; grid-template-columns: 1fr 34rem; gap: 5rem; align-items: end; }
.titulo { font-size: 9.4rem; line-height: .92; font-weight: 700; letter-spacing: -.02em; color: #fff; }
.titulo span { display: block; color: var(--ouro); font-weight: 500; font-style: italic; }
.chamada { font-size: 2.1rem; max-width: 40rem; margin: 2rem 0 2.6rem; line-height: 1.3; }
.modos { display: flex; gap: 1.4rem; }
.modo { background: var(--ouro); color: var(--noite); font-weight: 800; font-size: 2.1rem; padding: 1.3rem 2.4rem; border-radius: 5rem; box-shadow: 0 0 2.6rem rgba(240,182,60,.5); transition: transform .15s; }
.modo.b { background: rgba(21,16,10,.55); color: var(--areia); box-shadow: inset 0 0 0 .2rem var(--ouro); backdrop-filter: blur(6px); }
.modo:hover { transform: translateY(-.25rem); }
.modo small { display: block; font-size: 1.05rem; font-weight: 600; opacity: .75; }

/* placar */
.placar { background: rgba(21,16,10,.66); backdrop-filter: blur(10px); border-radius: 1.6rem; padding: 1.8rem 2rem; border-top: .3rem solid var(--ouro); }
.placar h2 { font-family: Fraunces, Georgia, serif; font-size: 2.3rem; font-weight: 700; margin-bottom: .2rem; }
.placar .sub { font-size: 1.15rem; opacity: .7; margin-bottom: 1rem; }
.lin { display: grid; grid-template-columns: 2.6rem 1fr auto 6.2rem; gap: .8rem; align-items: baseline; padding: .5rem .6rem; font-size: 1.65rem; border-radius: .6rem; }
.lin + .lin { border-top: 1px solid rgba(246,234,210,.13); }
.lin .pos { opacity: .6; font-weight: 800; }
.lin .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin .pt { font-weight: 800; font-variant-numeric: tabular-nums; }
.lin .tp { font-size: 1.2rem; opacity: .7; text-align: right; font-variant-numeric: tabular-nums; }
.lin.um .pos, .lin.um .pt { color: var(--ouro); opacity: 1; }
.lin.eu { background: rgba(240,182,60,.22); box-shadow: inset 0 0 0 .12rem var(--ouro); }
.vazio { font-size: 1.5rem; opacity: .75; padding: 1.2rem 0; line-height: 1.35; }

/* entrada (QR) */
.entrada { flex: 1; display: grid; gap: 0; align-items: center; }
.entrada.dupla { grid-template-columns: 1fr 1fr; }
.lado { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 3rem; }
.entrada.dupla .lado + .lado { border-left: .15rem solid rgba(246,234,210,.3); }
.lado h2 { font-family: Fraunces, Georgia, serif; font-size: 3.6rem; font-weight: 700; }
.lado p { font-size: 1.7rem; margin: .5rem 0 1.6rem; max-width: 30rem; line-height: 1.3; }
.qr { background: #fff; padding: 1.2rem; border-radius: 1.6rem; width: 25rem; height: 25rem; box-shadow: 0 0 4rem rgba(255,233,168,.45); }
.qr svg { width: 100%; height: 100%; display: block; }
.chegou { width: 25rem; height: 25rem; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,233,168,.95), rgba(240,182,60,.85) 55%, rgba(240,182,60,0) 72%); color: var(--noite); animation: acende .7s ease-out; }
.chegou b { font-family: Fraunces, Georgia, serif; font-size: 3.3rem; max-width: 17rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chegou span { font-size: 1.5rem; font-weight: 600; }
@keyframes acende { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.rodape { text-align: center; font-size: 1.35rem; opacity: .85; }
.conta { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 30rem; font-weight: 700; color: var(--brilho); text-shadow: 0 0 6rem rgba(240,182,60,.9); }
.conta span { animation: acende 1s ease-out; }

/* etapa */
.etapa { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.etapa .n { font-size: 2rem; font-weight: 600; color: var(--ouro); }
.nomeEtapa { font-size: 8.4rem; line-height: 1; font-weight: 700; color: #fff; max-width: 70rem; animation: sobe 1s ease-out; }
.etapa .bl { font-size: 2.3rem; margin-top: 1.2rem; }
@keyframes sobe { from { transform: translateY(2.5rem); opacity: 0; } to { transform: none; opacity: 1; } }

/* pergunta */
.topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem; }
.onde { font-size: 1.6rem; font-weight: 600; }
.onde b { color: var(--ouro); }
.jogs { display: flex; gap: 1.2rem; }
.jog { min-width: 17rem; background: rgba(21,16,10,.66); backdrop-filter: blur(10px); border-radius: 1.2rem; padding: .9rem 1.3rem; border-left: .45rem solid var(--ouro); position: relative; }
.jog.dois { border-left-color: #7fd0e8; }
.jog .nm { font-size: 1.5rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16rem; }
.jog .num { font-size: 2.9rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.jog .st { font-size: 1.15rem; opacity: .8; }
.jog.foi .st { color: var(--brilho); opacity: 1; font-weight: 600; }
.jog .ganho { position: absolute; right: 1rem; top: .8rem; font-size: 1.7rem; font-weight: 800; color: var(--vereda); animation: sobe .5s ease-out; }
.jog .ganho.zero { color: var(--barro); }
.corpo { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.tes { display: inline-block; align-self: flex-start; background: rgba(21,16,10,.7); color: var(--areia); box-shadow: inset 0 0 0 .15rem var(--vereda); font-weight: 800; font-size: 1.4rem; padding: .4rem 1.1rem; border-radius: 3rem; margin-bottom: 1rem; }
.tes.n2 { box-shadow: inset 0 0 0 .15rem var(--ouro); } .tes.n3 { box-shadow: inset 0 0 0 .15rem var(--barro); } .tes.t { background: var(--ouro); color: var(--noite); box-shadow: 0 0 2rem rgba(240,182,60,.7); }
.perg { font-size: 4.2rem; line-height: 1.12; font-weight: 500; color: #fff; max-width: 76rem; margin-bottom: 2rem; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; }
.op { display: flex; align-items: center; gap: 1.2rem; background: rgba(21,16,10,.7); backdrop-filter: blur(10px); border-radius: 1.1rem; padding: 1rem 1.4rem; font-size: 2.05rem; font-weight: 600; line-height: 1.18; min-height: 5.6rem; transition: opacity .5s, background .5s, color .5s; }
.op i { flex: none; width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--areia); color: var(--noite); font-style: normal; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.op.certa { background: var(--ouro); color: var(--noite); box-shadow: 0 0 3rem rgba(240,182,60,.7); }
.op.certa i { background: var(--noite); color: var(--brilho); }
.op.fora { opacity: .32; }
.sabia { margin-top: 1.4rem; font-size: 1.95rem; line-height: 1.32; max-width: 82rem; padding-left: 1.4rem; border-left: .35rem solid var(--ouro); animation: sobe .6s ease-out; }
.sabia b { color: var(--ouro); }
.seg { font-family: Fraunces, Georgia, serif; font-size: 3.4rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 5rem; text-align: center; }

/* final */
.final { flex: 1; display: grid; grid-template-columns: 1fr 36rem; gap: 4rem; align-items: center; }
.res + .res { margin-top: 2.2rem; }
.res .quem { font-size: 2.1rem; font-weight: 600; }
.res .pts { font-family: Fraunces, Georgia, serif; font-size: 8rem; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.res.venc .pts { color: var(--ouro); text-shadow: 0 0 3rem rgba(240,182,60,.6); }
.res .det { font-size: 1.8rem; margin-top: .4rem; }
.res .det b { color: var(--ouro); }
.fimTit { font-family: Fraunces, Georgia, serif; font-size: 3.4rem; font-weight: 700; margin-bottom: 2rem; color: var(--brilho); }

/* plateia, reações e efeitos */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.emo { position: absolute; bottom: -5rem; font-size: 4.4rem; animation: voa 3.4s ease-out forwards; }
@keyframes voa { 0% { transform: translateY(0) scale(.4); opacity: 0; } 12% { opacity: 1; transform: translateY(-9vh) scale(1.2); } 100% { transform: translate(var(--dx), -82vh) rotate(var(--rot)); opacity: 0; } }
.conf { position: absolute; top: -3rem; width: .9rem; height: 1.6rem; border-radius: .2rem; animation: cai linear forwards; }
@keyframes cai { to { transform: translate(var(--dx), 112vh) rotate(900deg); } }
.plat { display: flex; align-items: center; gap: .9rem; background: rgba(21,16,10,.66); backdrop-filter: blur(10px); border-radius: 1.2rem; padding: .6rem 1.1rem .6rem .6rem; }
.plat .q { flex: none; background: #fff; border-radius: .6rem; padding: .3rem; width: 6.6rem; height: 6.6rem; }
.plat .q svg { width: 100%; height: 100%; display: block; }
.plat b { display: block; font-size: 1.3rem; max-width: 12rem; line-height: 1.15; }
.plat span { font-size: 1.05rem; opacity: .8; display: block; max-width: 12rem; margin-top: .2rem; }
.abertura .plat { display: inline-flex; margin-top: 1.6rem; }
.abertura .plat b, .abertura .plat span { max-width: 22rem; }
.lado2 { display: flex; gap: 1.2rem; align-items: flex-start; }
.luzes { display: flex; gap: .28rem; margin-top: .4rem; }
.luzes i { width: 1.1rem; height: .45rem; border-radius: .3rem; background: rgba(246,234,210,.22); }
.luzes i.s { background: var(--ouro); box-shadow: 0 0 .7rem var(--ouro); }
.luzes i.n { background: var(--barro); }
.seq { color: var(--brilho); font-weight: 800; }
.perg.peq { font-size: 2.7rem; margin-bottom: 1.1rem; max-width: 70rem; }
.ops.uma { grid-template-columns: 1fr; max-width: 62rem; }
.op em { margin-left: auto; padding-left: 1.4rem; font-style: normal; font-size: 1.35rem; font-weight: 800; white-space: nowrap; }
.entra .perg { animation: sobe .6s ease-out both; }
.entra .op { animation: sobe .5s ease-out both; }
.entra .op:nth-child(1) { animation-delay: .5s; } .entra .op:nth-child(2) { animation-delay: .7s; } .entra .op:nth-child(3) { animation-delay: .9s; } .entra .op:nth-child(4) { animation-delay: 1.1s; }
.entra .op.certa { animation: pulsa .7s ease-out both; }
@keyframes pulsa { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: none; } }
body.rev #veu { background: linear-gradient(180deg, rgba(21,16,10,.4) 0%, rgba(21,16,10,0) 20%, rgba(21,16,10,.1) 44%, rgba(21,16,10,.93) 76%); }

/* lista completa */
#lista { position: fixed; inset: 0; background: rgba(21,16,10,.96); padding: 3rem 6rem; overflow: auto; display: none; z-index: 9; }
#lista.on { display: block; }
#lista h2 { font-family: Fraunces, Georgia, serif; font-size: 3rem; margin-bottom: .4rem; }
#lista p { font-size: 1.3rem; opacity: .75; margin-bottom: 1.4rem; }
#lista .lin { cursor: pointer; max-width: 60rem; }
#lista .lin:hover { background: rgba(217,81,47,.3); }
@media (prefers-reduced-motion: reduce) { .bg { animation: none; } }
</style>
</head>
<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
<canvas id="motes"></canvas>
<div id="veu"></div>
<main id="tela"></main>
<div id="fio"></div>
<div id="rede"></div>
<div id="credito"></div>
<div id="fx"></div>
<div id="lista"></div>

<script src="mqtt.min.js"></script>
<script src="qrcode.min.js"></script>
<script src="perguntas.js"></script>
<script src="imagens.js"></script>
<script>
'use strict';
/* ================= AJUSTES (pode mexer) ================= */
var CFG = {
  ENDERECO: 'https://ageuphysfox.github.io/luz-do-cerrado/',              // endereço publicado da pasta do jogo (ex.: https://usuario.github.io/luz-do-cerrado/). Vazio = usa o endereço desta página
  TEMPO: 20,                 // segundos para responder
  TEMPO_SABIA: 9,            // segundos mostrando a resposta e o "Você sabia?"
  PONTOS: {1: 500, 2: 700, 3: 900},   // pontos por acerto: fácil, média, difícil
  BONUS_RAPIDEZ: 400,        // bônus máximo para quem responde na hora
  BONUS_SEQUENCIA: 200,      // bônus a partir de 3 acertos seguidos
  PLACAR_NA_TELA: 8          // quantos nomes aparecem no placar da abertura
};
var BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];

/* ================= PARADAS DA VIAGEM (as perguntas ficam no arquivo perguntas.js) ================= */
var ABERTURA = {foto: 'fotos/abertura.jpg', cred: 'Ana Cláudia Matias A. Capistrano, CC BY-SA 4.0'};
var ETAPAS = [
  {nome: 'Dunas do Jalapão', blurb: 'A areia dourada no coração do Tocantins.', foto: 'fotos/jalapao.jpg', cred: 'Marcel Favery, CC BY-SA 4.0'},
  {nome: 'Cachoeira da Velha', blurb: 'O rio Novo despenca no meio do Cerrado.', foto: 'fotos/cachoeira.jpg', cred: 'Marcel Favery, CC BY-SA 4.0'},
  {nome: 'Ilha do Bananal', blurb: 'O rio Javaés abraça a maior ilha de rio do mundo.', foto: 'fotos/bananal.jpg', cred: 'Arthur to, domínio público'},
  {nome: 'Pôr do sol em Palmas', blurb: 'O céu pega fogo na Praia da Graciosa.', foto: 'fotos/palmas.jpg', cred: 'Anurb01, CC BY-SA 4.0'},
  {nome: 'Noite de estrelas', blurb: 'Longe das cidades, a Via Láctea aparece inteira.', foto: 'fotos/noite.jpg', cred: 'Paulomelo.adv, CC BY-SA 4.0'}
];
// nível de cada pergunta, parada por parada: 1 fácil, 2 média, 3 difícil, 'T' pergunta do tesouro (vale o dobro)
var ROTEIRO = [[1, 1], [1, 2], [2, 2], [2, 3], [3, 'T']];
var NIVEL = {1: 'Fácil', 2: 'Média', 3: 'Difícil'};

/* ================= utilidades ================= */
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function mil(n) { return Number(n).toLocaleString('pt-BR'); }
function seg(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' s'; }
function embaralhar(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function codigo(n) { var s = '', c = 'abcdefghjkmnpqrstuvwxyz23456789'; for (var i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
var QS = new URLSearchParams(location.search);
['TEMPO', 'TEMPO_SABIA'].forEach(function (k) { if (QS.get(k.toLowerCase())) CFG[k] = +QS.get(k.toLowerCase()); });
var T_ETAPA = QS.get('rapido') ? 600 : 3200, T_CONTA = QS.get('rapido') ? 300 : 1000;

/* ================= som ================= */
var AC = null, mudo = false;
function bip(f, d, tipo, v, quando) {
  if (mudo) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (quando || 0);
    o.type = tipo || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
function somCerto() { bip(660, .15, 'triangle', .15); bip(880, .15, 'triangle', .15, .12); bip(1320, .35, 'triangle', .15, .24); }
function somErro() { bip(220, .3, 'sawtooth', .08); bip(165, .45, 'sawtooth', .08, .18); }
function somFim() { [523, 659, 784, 1047, 1319].forEach(function (f, i) { bip(f, .4, 'triangle', .14, i * .14); }); }

/* ================= placar (fica guardado neste navegador) ================= */
var CHAVE = 'luzcerrado_placar_v1';
function lerPlacar() { try { return JSON.parse(localStorage.getItem(CHAVE)) || []; } catch (e) { return []; } }
function gravarPlacar(p) { try { localStorage.setItem(CHAVE, JSON.stringify(p)); } catch (e) {} }
function ordenar(p) { return p.sort(function (a, b) { return b.p - a.p || a.t - b.t || a.q - b.q; }); }
function htmlPlacar(lista, n, meus) {
  var todos = ordenar(lerPlacar()), h = '<div class="placar"><h2>Placar da feira</h2><div class="sub">' +
    (todos.length ? todos.length + (todos.length > 1 ? ' pessoas já jogaram' : ' pessoa já jogou') + '. Empate? Ganha quem respondeu mais rápido.' : 'Pontos e tempo de resposta') + '</div>';
  if (!todos.length) h += '<div class="vazio">Ninguém jogou ainda.<br>O primeiro nome do placar pode ser o seu.</div>';
  var mostrados = todos.slice(0, n);
  (meus || []).forEach(function (q) { var i = todos.findIndex(function (x) { return x.q === q; }); if (i >= n) mostrados.push(todos[i]); });
  mostrados.forEach(function (x) {
    var i = todos.indexOf(x);
    h += '<div class="lin' + (i === 0 ? ' um' : '') + ((meus || []).indexOf(x.q) >= 0 ? ' eu' : '') + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(x.n) +
      '</span><span class="pt">' + mil(x.p) + '</span><span class="tp">' + seg(x.t) + '</span></div>';
  });
  return h + '</div>';
}
function abrirLista() {
  var todos = ordenar(lerPlacar()), h = '<h2>Placar completo (' + todos.length + ')</h2><p>Clique em um nome para apagar. Teclas: E exporta a planilha, Shift+Delete apaga tudo, L ou Esc fecha.</p>';
  todos.forEach(function (x, i) {
    h += '<div class="lin" data-q="' + x.q + '"><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(x.n) + '  (' + x.c + ' certas)</span><span class="pt">' + mil(x.p) + '</span><span class="tp">' + seg(x.t) + '</span></div>';
  });
  $('lista').innerHTML = h; $('lista').classList.add('on');
}
$('lista').addEventListener('click', function (ev) {
  var l = ev.target.closest('.lin'); if (!l) return;
  var q = +l.dataset.q, p = lerPlacar(), x = p.find(function (y) { return y.q === q; });
  if (x && confirm('Apagar "' + x.n + '" do placar?')) { gravarPlacar(p.filter(function (y) { return y.q !== q; })); abrirLista(); if (S.fase === 'abertura') desenhar(); }
});
function exportar() {
  var csv = '﻿posicao;nome;pontos;certas;tempo_s;horario\n';

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function laco(t) {
    cx.clearRect(0, 0, W, H);
    ps.forEach(function (p) {
      p.y -= p.v * .016; if (p.y < -.05) { p.y = 1.05; p.x = Math.random(); }
      var x = (p.x + Math.sin(t / 2600 + p.f) * .012) * W, y = p.y * H, r = p.r * W / 900, al = .25 + .45 * Math.abs(Math.sin(t / 900 + p.f));
      var g = cx.createRadialGradient(x, y, 0, x, y, r * 5);
      g.addColorStop(0, 'rgba(255,236,170,' + al + ')'); g.addColorStop(1, 'rgba(255,236,170,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 5, 0, 7); cx.fill();
    });
    requestAnimationFrame(laco);
  })(0);
})();

/* ================= reações da plateia, confete e vitrine ================= */
var EMOS = ['👏', '😮', '🔥', '😂', '❤️'];
function reacao(i) {
  var fx = $('fx'); if (fx.children.length > 70) return;
  var e = document.createElement('span'); e.className = 'emo'; e.textContent = EMOS[i] || EMOS[0];
  e.style.left = (4 + Math.random() * 88) + '%'; e.style.setProperty('--dx', (Math.random() * 16 - 8) + 'rem'); e.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
  fx.appendChild(e); setTimeout(function () { e.remove(); }, 3500);
}
function confete(n) {
  var fx = $('fx'), cores = ['#f0b63c', '#ffe9a8', '#3fa877', '#f6ead2', '#d9512f'];
  for (var i = 0; i < n; i++) {
    var c = document.createElement('span'); c.className = 'conf';
    c.style.left = (Math.random() * 100) + '%'; c.style.background = cores[i % cores.length];
    c.style.animationDuration = (2.2 + Math.random() * 2.4) + 's'; c.style.animationDelay = (Math.random() * .9) + 's'; c.style.setProperty('--dx', (Math.random() * 20 - 10) + 'rem');
    fx.appendChild(c); (function (el) { setTimeout(function () { el.remove(); }, 6000); })(c);
  }
}
setInterval(attPlateia, 1000);
// vitrine: na abertura, as fotos vão passando para chamar quem está por perto
var vitrine = 0;
setInterval(function () {
  if (S.fase !== 'abertura' || typeof IMG === 'undefined') return;
  var ks = Object.keys(IMG); vitrine = (vitrine + 1) % (ks.length + 1);
  fundo(vitrine ? IMG[ks[vitrine - 1]] : ABERTURA);
}, 7000);

ETAPAS.forEach(function (e) { new Image().src = e.foto; });   // deixa as fotos carregadas
irAbertura(); rede(); conectar(0);
</script>
