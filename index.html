<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luz do Cerrado - telão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --noite: #15100a; --ouro: #f0b63c; --brilho: #ffe9a8; --areia: #f6ead2; --vereda: #3fa877; --barro: #d9512f; --ceu: #7fd0e8; }
* { box-sizing: border-box; margin: 0; }
html { font-size: min(1vw, 1.78vh); }
body { background: var(--noite); color: var(--areia); font-family: Figtree, "Segoe UI", sans-serif; overflow: hidden; height: 100vh; cursor: default; user-select: none; }
.titulo, .perg, .nomeEtapa, .num { font-family: Fraunces, Georgia, serif; }
.bg { position: fixed; inset: -4%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.6s ease; animation: passeio 46s ease-in-out infinite alternate; }
.bg.on { opacity: 1; }
body.mural .bg { opacity: 0; }
@keyframes passeio { from { transform: scale(1.02) translate(-1%, .6%); } to { transform: scale(1.13) translate(1.4%, -1%); } }
#motes { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
#veu { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(21,16,10,.55) 0%, rgba(21,16,10,.12) 26%, rgba(21,16,10,.5) 58%, rgba(21,16,10,.93) 100%); transition: background 1s; }
body.forte #veu { background: linear-gradient(180deg, rgba(21,16,10,.74) 0%, rgba(21,16,10,.62) 40%, rgba(21,16,10,.93) 100%); }
body.mural #veu { background: linear-gradient(90deg, rgba(21,16,10,.93) 0%, rgba(21,16,10,.72) 38%, rgba(21,16,10,.3) 70%, rgba(21,16,10,.5) 100%); }
body.mural.forte #veu { background: rgba(21,16,10,.84); }
#fio { position: fixed; left: 0; top: 0; height: .55rem; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--ouro), var(--brilho)); box-shadow: 0 0 1.6rem .3rem rgba(255,214,120,.75); opacity: 0; transition: opacity .4s; z-index: 3; }
#fio.on { opacity: 1; }
#fio.fim { background: var(--barro); box-shadow: 0 0 1.6rem .3rem rgba(217,81,47,.8); }
#tela { position: fixed; inset: 0; padding: 4rem 5rem 3.4rem; display: flex; flex-direction: column; z-index: 2; }
#credito { position: fixed; right: 1.2rem; bottom: .7rem; font-size: .95rem; opacity: .6; text-shadow: 0 1px 3px #000; z-index: 3; }
#rede { position: fixed; left: 1.2rem; bottom: .7rem; font-size: .95rem; opacity: .7; text-shadow: 0 1px 3px #000; z-index: 3; }
.sombra { text-shadow: 0 .15rem 1.2rem rgba(0,0,0,.75), 0 0 .2rem rgba(0,0,0,.6); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: .25rem solid var(--brilho); outline-offset: .3rem; }

/* mural de fotos em movimento (abertura) */
#mural { position: fixed; inset: -20% -12%; display: flex; flex-direction: column; justify-content: center; transform: rotate(-5deg); opacity: 0; transition: opacity 1.2s; }
body.mural #mural { opacity: 1; }
.fita { display: flex; width: max-content; margin: .7rem 0; animation: corre 110s linear infinite; }
.fita.r { animation-direction: reverse; animation-duration: 135s; }
@keyframes corre { to { transform: translateX(-50%); } }
.cartao { flex: none; width: 27rem; height: 17rem; margin-right: 1.4rem; border-radius: 1.2rem; background-size: cover; background-position: center; position: relative; box-shadow: 0 .6rem 2rem rgba(0,0,0,.5); overflow: hidden; }
.cartao span { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.2rem 1rem .7rem; font-weight: 800; font-size: 1.3rem; background: linear-gradient(180deg, rgba(21,16,10,0), rgba(21,16,10,.85)); }

/* abertura */
.abertura { flex: 1; display: grid; grid-template-columns: 1fr 34rem; gap: 5rem; align-items: end; }
.titulo { font-size: 9.4rem; line-height: .92; font-weight: 700; letter-spacing: -.02em; color: #fff; }
.titulo span { display: block; color: var(--ouro); font-weight: 500; font-style: italic; }
.chamada { font-size: 2.1rem; max-width: 40rem; margin: 2rem 0 2.6rem; line-height: 1.3; }
.modos { display: flex; gap: 1.4rem; }
.modo { background: var(--ouro); color: var(--noite); font-weight: 800; font-size: 2.1rem; padding: 1.3rem 2.4rem; border-radius: 5rem; box-shadow: 0 0 2.6rem rgba(240,182,60,.5); transition: transform .15s; animation: chama 2.4s ease-in-out infinite; }
.modo.b { background: rgba(21,16,10,.55); color: var(--areia); box-shadow: inset 0 0 0 .2rem var(--ouro); backdrop-filter: blur(6px); animation: none; }
.modo:hover { transform: translateY(-.25rem); }
.modo small { display: block; font-size: 1.05rem; font-weight: 600; opacity: .75; }
@keyframes chama { 50% { box-shadow: 0 0 4.4rem rgba(255,214,120,.95); } }
.modos.peq .modo { font-size: 1.5rem; padding: .9rem 1.7rem; }
.modos.peq .modo small { font-size: .9rem; }

/* placar */
.placar { background: rgba(21,16,10,.74); backdrop-filter: blur(10px); border-radius: 1.6rem; padding: 1.8rem 2rem; border-top: .3rem solid var(--ouro); }
.placar h2 { font-family: Fraunces, Georgia, serif; font-size: 2.3rem; font-weight: 700; margin-bottom: .2rem; }
.placar .sub { font-size: 1.15rem; opacity: .7; margin-bottom: 1rem; }
.lin { display: grid; grid-template-columns: 2.6rem 1fr auto 5.6rem; gap: .8rem; align-items: baseline; padding: .5rem .6rem; font-size: 1.65rem; border-radius: .6rem; }
.lin + .lin { border-top: 1px solid rgba(246,234,210,.13); }
.lin .pos { opacity: .6; font-weight: 800; }
.lin .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lin .pt { font-weight: 800; font-variant-numeric: tabular-nums; }
.lin .tp { font-size: 1.2rem; opacity: .7; text-align: right; font-variant-numeric: tabular-nums; }
.lin.um .pos, .lin.um .pt { color: var(--ouro); opacity: 1; }
.lin.eu { background: rgba(240,182,60,.22); box-shadow: inset 0 0 0 .12rem var(--ouro); }
.vazio { font-size: 1.5rem; opacity: .75; padding: 1.2rem 0; line-height: 1.35; }
.entra .placar .lin { animation: sobe .5s ease-out both; }
.entra .placar .lin:nth-child(n+4) { animation-delay: .1s; } .entra .placar .lin:nth-child(n+6) { animation-delay: .2s; } .entra .placar .lin:nth-child(n+8) { animation-delay: .3s; }

/* entrada (QR) */
.entrada { flex: 1; display: grid; gap: 0; align-items: center; }
.entrada.dupla { grid-template-columns: 1fr 1fr; }
.lado { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 3rem; }
.entrada.dupla .lado + .lado { border-left: .15rem solid rgba(246,234,210,.3); }
.lado h2 { font-family: Fraunces, Georgia, serif; font-size: 3.6rem; font-weight: 700; }
.lado p { font-size: 1.7rem; margin: .5rem 0 1.6rem; max-width: 30rem; line-height: 1.3; }
.qr { background: #fff; padding: 1.2rem; border-radius: 1.6rem; width: 25rem; height: 25rem; box-shadow: 0 0 4rem rgba(255,233,168,.45); animation: chama 2.4s ease-in-out infinite; }
.qr svg { width: 100%; height: 100%; display: block; }
.chegou { width: 25rem; height: 25rem; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,233,168,.95), rgba(240,182,60,.85) 55%, rgba(240,182,60,0) 72%); color: var(--noite); animation: acende .7s ease-out; }
.chegou b { font-family: Fraunces, Georgia, serif; font-size: 3.3rem; max-width: 17rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chegou span { font-size: 1.5rem; font-weight: 600; }
@keyframes acende { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.rodape { text-align: center; font-size: 1.35rem; opacity: .85; }
.conta { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 30rem; font-weight: 700; color: var(--brilho); text-shadow: 0 0 6rem rgba(240,182,60,.9); }
.conta span { animation: bum 1s ease-out; }
@keyframes bum { 0% { transform: scale(2.6); opacity: 0; } 35% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }

/* etapa e chamada dos desafios */
.etapa { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.etapa .n { font-size: 2rem; font-weight: 600; color: var(--ouro); animation: sobe .5s ease-out both; }
.nomeEtapa { font-size: 8.4rem; line-height: 1; font-weight: 700; color: #fff; max-width: 78rem; }
.etapa .bl { font-size: 2.3rem; margin-top: 1.2rem; max-width: 60rem; line-height: 1.3; animation: sobe .7s .7s ease-out both; }
.etapa.des { justify-content: center; align-items: center; text-align: center; }
.etapa.des .nomeEtapa { color: var(--ouro); font-size: 9.6rem; text-shadow: 0 0 5rem rgba(240,182,60,.55), 0 .2rem 1.4rem rgba(0,0,0,.8); }
.pal { display: inline-block; white-space: nowrap; }
.lt { display: inline-block; animation: letra .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes letra { from { transform: translateY(1.1em) rotate(12deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sobe { from { transform: translateY(2.5rem); opacity: 0; } to { transform: none; opacity: 1; } }

/* pergunta */
.topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem; }
.onde { font-size: 1.6rem; font-weight: 600; min-width: 22rem; }
.onde b { color: var(--ouro); }
.jogs { display: flex; gap: 1.2rem; }
.jog { min-width: 17rem; background: rgba(21,16,10,.72); backdrop-filter: blur(10px); border-radius: 1.2rem; padding: .9rem 1.3rem; border-left: .45rem solid var(--ouro); position: relative; }
.jog.dois { border-left-color: var(--ceu); }
.jog .nm { font-size: 1.5rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16rem; }
.jog .num { font-size: 2.9rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.jog .st { font-size: 1.15rem; opacity: .8; }
.jog.foi .st { color: var(--brilho); opacity: 1; font-weight: 600; }
.jog.agora { animation: trava .6s ease-out; }
@keyframes trava { 0% { transform: scale(1.14); box-shadow: 0 0 4rem var(--brilho); background: rgba(240,182,60,.6); } 100% { transform: none; } }
.jog.fogo { box-shadow: 0 0 0 .15rem var(--ouro), 0 0 2.6rem rgba(240,120,40,.8); animation: fogo 1s ease-in-out infinite alternate; }
@keyframes fogo { to { box-shadow: 0 0 0 .15rem var(--brilho), 0 0 4.2rem rgba(255,170,60,1); } }
.jog.pulso { animation: pulso .7s ease-out; }
@keyframes pulso { 0% { transform: scale(1.18); background: rgba(240,182,60,.7); } 100% { transform: none; } }
.jog .ganho { position: absolute; right: 1rem; top: .8rem; font-size: 1.7rem; font-weight: 800; color: var(--vereda); animation: sobe .5s ease-out; }
.jog .ganho.zero { color: var(--barro); }
.corpo { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.tes { display: inline-block; align-self: flex-start; background: rgba(21,16,10,.7); color: var(--areia); box-shadow: inset 0 0 0 .15rem var(--vereda); font-weight: 800; font-size: 1.4rem; padding: .4rem 1.1rem; border-radius: 3rem; margin-bottom: 1rem; }
.tes.n2 { box-shadow: inset 0 0 0 .15rem var(--ouro); } .tes.n3 { box-shadow: inset 0 0 0 .15rem var(--barro); } .tes.t { background: var(--ouro); color: var(--noite); box-shadow: 0 0 2rem rgba(240,182,60,.7); }
.perg { font-size: 4.2rem; line-height: 1.12; font-weight: 500; color: #fff; max-width: 76rem; margin-bottom: 2rem; }
.ops { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; }
.op { display: flex; align-items: center; gap: 1.2rem; background: rgba(21,16,10,.74); backdrop-filter: blur(10px); border-radius: 1.1rem; padding: 1rem 1.4rem; font-size: 2.05rem; font-weight: 600; line-height: 1.18; min-height: 5.6rem; transition: opacity .5s, background .5s, color .5s; }
.op i { flex: none; width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--areia); color: var(--noite); font-style: normal; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.op.certa { background: var(--ouro); color: var(--noite); box-shadow: 0 0 3rem rgba(240,182,60,.7); }
.op.certa i { background: var(--noite); color: var(--brilho); }
.op.fora { opacity: .3; animation: cai2 .6s ease-in both; }
@keyframes cai2 { from { opacity: 1; transform: none; } to { opacity: .3; transform: scale(.96); } }
.op.susp { animation: susp .36s ease-in-out infinite alternate; }
.op.susp:nth-child(2) { animation-delay: .09s; } .op.susp:nth-child(3) { animation-delay: .18s; } .op.susp:nth-child(4) { animation-delay: .27s; }
@keyframes susp { to { background: rgba(240,182,60,.5); transform: scale(1.02); } }
.op u { margin-left: auto; text-decoration: none; font-size: 1.2rem; font-weight: 800; padding: .25rem .8rem; border-radius: 2rem; background: var(--noite); color: var(--ouro); white-space: nowrap; animation: acende .4s ease-out; }
.op u + u { margin-left: .4rem; } .op u.d { color: var(--ceu); }
.sabia { margin-top: 1.4rem; font-size: 1.95rem; line-height: 1.32; max-width: 82rem; padding-left: 1.4rem; border-left: .35rem solid var(--ouro); animation: sobe .6s ease-out; }
.sabia b { color: var(--ouro); }
.relo { position: relative; width: 8.4rem; height: 8.4rem; flex: none; }
.relo svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.relo circle { fill: rgba(21,16,10,.6); stroke: rgba(246,234,210,.2); stroke-width: 7; }
.relo #arco { fill: none; stroke: var(--ouro); stroke-linecap: round; filter: drop-shadow(0 0 .5rem var(--ouro)); }
.relo b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 3.6rem; font-variant-numeric: tabular-nums; }
body.urg .relo #arco { stroke: var(--barro); filter: drop-shadow(0 0 .7rem var(--barro)); }
body.urg .relo b { color: #ffb39e; animation: bate .5s ease-in-out infinite alternate; }
@keyframes bate { to { transform: scale(1.22); } }
#alerta { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 11rem 2rem rgba(217,81,47,.75); opacity: 0; transition: opacity .4s; z-index: 3; }
body.urg #alerta { opacity: 1; animation: alerta .5s ease-in-out infinite alternate; }
@keyframes alerta { to { opacity: .45; } }
#clarao { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,240,190,.95), rgba(240,182,60,.5)); opacity: 0; z-index: 6; }
#clarao.on { animation: clarao .7s ease-out; }
#clarao.ruim { background: rgba(217,81,47,.6); }
@keyframes clarao { from { opacity: .85; } to { opacity: 0; } }
#tela.tremer { animation: tremer .45s linear; }
@keyframes tremer { 20% { transform: translateX(-1.1rem); } 40% { transform: translateX(1rem); } 60% { transform: translateX(-.7rem); } 80% { transform: translateX(.5rem); } }

/* desafios de foto: lanterna, zoom e mosaico */
.corpo.foto { flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 3rem; }
#palco { position: relative; flex: none; width: 54rem; height: 35rem; border-radius: 1.6rem; overflow: hidden; background: #060402; box-shadow: 0 0 0 .2rem rgba(240,182,60,.5), 0 1rem 4rem rgba(0,0,0,.7); }
#palco.g { width: 58rem; height: 38rem; }
#pimg { position: absolute; inset: 0; background-size: cover; background-position: center; will-change: transform; }
#pesc { position: absolute; inset: 0; }
#pesc.mos { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(6, 1fr); }
.mz { background: #1b140c; box-shadow: inset 0 0 0 1px rgba(240,182,60,.28); transition: transform .7s cubic-bezier(.5,-.4,.7,1), opacity .7s; }
.mz:nth-child(odd) { background: #241a0e; }
.mz.x { transform: scale(0) rotate(50deg); opacity: 0; }
#palco.rev #pesc { animation: some .7s ease-out forwards; }
#palco.rev #pimg { animation: abre .9s ease-out; }
@keyframes some { to { opacity: 0; } }
@keyframes abre { from { transform: scale(1.25); filter: brightness(2); } to { transform: none; filter: none; } }
.pnome { position: absolute; left: 0; right: 0; bottom: 0; padding: 3.4rem 1.6rem 1.1rem; font-family: Fraunces, Georgia, serif; font-size: 3.4rem; font-weight: 700; color: #fff; background: linear-gradient(180deg, rgba(21,16,10,0), rgba(21,16,10,.9)); animation: sobe .6s .3s ease-out both; }
.colu { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.colu .perg { font-size: 2.9rem; margin-bottom: 1.2rem; }
.colu .ops { grid-template-columns: 1fr; gap: .8rem; }
.colu .op { font-size: 1.85rem; min-height: 4.7rem; padding: .7rem 1.2rem; }
.colu .op i { width: 3rem; height: 3rem; }
.colu .sabia { font-size: 1.75rem; margin-top: 1.1rem; }
.demo { flex: 1; display: flex; align-items: center; gap: 4rem; }
.demo .colu { justify-content: center; }
.demo .nomeEtapa { font-size: 5.6rem; color: var(--ouro); margin-bottom: 1rem; }
.demo .chamada { margin: 0 0 1.6rem; font-size: 1.9rem; }
.demo .modos { margin-top: 2.2rem; }

/* final */
.final { flex: 1; display: grid; grid-template-columns: 1fr 36rem; gap: 4rem; align-items: center; }
.res + .res { margin-top: 2.2rem; }
.res { position: relative; }
.res .quem { font-size: 2.1rem; font-weight: 600; }
.res .pts { font-family: Fraunces, Georgia, serif; font-size: 8rem; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.res.venc .pts { color: var(--ouro); text-shadow: 0 0 3rem rgba(240,182,60,.6); }
.res .det { font-size: 1.8rem; margin-top: .4rem; animation: sobe .6s 2.3s ease-out both; }
.res .det b { color: var(--ouro); }
.selo { position: absolute; left: 30rem; top: 1rem; width: 11rem; height: 11rem; border-radius: 50%; background: var(--ouro); color: var(--noite); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 4.4rem; line-height: 1; box-shadow: 0 0 4rem rgba(240,182,60,.8); transform: rotate(-9deg); animation: selo .6s 2.2s cubic-bezier(.2,1.6,.4,1) both; }
.selo small { font-family: Figtree, sans-serif; font-size: 1.15rem; font-weight: 800; }
@keyframes selo { from { transform: scale(3.4) rotate(20deg); opacity: 0; } to { transform: rotate(-9deg); opacity: 1; } }
.fimTit { font-family: Fraunces, Georgia, serif; font-size: 3.4rem; font-weight: 700; margin-bottom: 2rem; color: var(--brilho); }

/* reações, confete e plateia (opcional, tecla P) */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.emo { position: absolute; bottom: -5rem; font-size: 4.4rem; animation: voa 3.4s ease-out forwards; }
@keyframes voa { 0% { transform: translateY(0) scale(.4); opacity: 0; } 12% { opacity: 1; transform: translateY(-9vh) scale(1.2); } 100% { transform: translate(var(--dx), -82vh) rotate(var(--rot)); opacity: 0; } }
.conf { position: absolute; top: -3rem; width: .9rem; height: 1.6rem; border-radius: .2rem; animation: cai linear forwards; }
@keyframes cai { to { transform: translate(var(--dx), 112vh) rotate(900deg); } }
.plat { display: flex; align-items: center; gap: .9rem; background: rgba(21,16,10,.66); backdrop-filter: blur(10px); border-radius: 1.2rem; padding: .6rem 1.1rem .6rem .6rem; }
.plat .q { flex: none; background: #fff; border-radius: .6rem; padding: .3rem; width: 6.6rem; height: 6.6rem; }
.plat .q svg { width: 100%; height: 100%; display: block; }
.plat b { display: block; font-size: 1.3rem; max-width: 12rem; line-height: 1.15; }
.plat span { font-size: 1.05rem; opacity: .8; display: block; max-width: 12rem; margin-top: .2rem; }
.abertura .plat { display: inline-flex; margin-top: 1.6rem; }
.abertura .plat b, .abertura .plat span { max-width: 22rem; }
.lado2 { display: flex; gap: 1.2rem; align-items: flex-start; }
.luzes { display: flex; gap: .28rem; margin-top: .4rem; }
.luzes i { width: 1.1rem; height: .45rem; border-radius: .3rem; background: rgba(246,234,210,.22); }
.luzes i.s { background: var(--ouro); box-shadow: 0 0 .7rem var(--ouro); }
.luzes i.n { background: var(--barro); }
.seq { color: var(--brilho); font-weight: 800; }
.perg.peq { font-size: 2.7rem; margin-bottom: 1.1rem; max-width: 70rem; }
.ops.uma { grid-template-columns: 1fr; max-width: 62rem; }
.op em { margin-left: auto; padding-left: 1.4rem; font-style: normal; font-size: 1.35rem; font-weight: 800; white-space: nowrap; }
.entra .perg { animation: sobe .6s ease-out both; }
.entra .op { animation: voaop .55s cubic-bezier(.2,1.3,.4,1) both; }
.entra .op:nth-child(1) { animation-delay: .5s; } .entra .op:nth-child(2) { animation-delay: .7s; } .entra .op:nth-child(3) { animation-delay: .9s; } .entra .op:nth-child(4) { animation-delay: 1.1s; }

var QS = new URLSearchParams(location.search);

var RAP = !!QS.get('rapido');
var T_ETAPA = RAP ? 500 : 3400, T_DES = RAP ? 500 : 3600, T_CONTA = RAP ? 300 : 1000, T_SUSP = RAP ? 150 : 1500, T_MARCA = RAP ? 250 : 2800;

var AC = null, mudo = false;
function bip(f, d, tipo, v, quando) {

  } catch (e) {}
}

  ETAPAS.forEach(function (e) { h += esc(e.nome) + ': ' + esc(e.cred) + '<br>'; });

});
function exportar() {
  var csv = '﻿posicao;nome;nota;certas;tempo_s;horario\n';
  ordenar(lerPlacar()).forEach(function (x, i) { csv += (i + 1) + ';' + x.n.replace(/;/g, ',') + ';' + mil(x.p) + ';' + x.c + ';' + (x.t / 1000).toFixed(1).replace('.', ',') + ';' + new Date(x.q).toLocaleString('pt-BR') + '\n'; });

/* ================= estado ================= */
var SALA = codigo(6);
var S = {fase: 'abertura', modo: 1, slots: [null, null], fila: [], k: -1, ate: 0, t0: 0, conta: 3, meus: [], resp: {}, pd: [0, 0, 0, 0], rev: 0, ints: [], inter: null, demo: null, demoEm: 0, demoN: 0, plat: false, agora: null};
var PAL = null;  // animação da foto no palco: {tipo, t0, dur, f, ox, oy, ordem, rev}
var PRES = {};   // celulares da plateia vistos há pouco
function presentes() {
  var agora = Date.now();
  return Object.keys(PRES).filter(function (id) { return agora - PRES[id] < 15000 && !S.slots.some(function (x) { return x && x.id === id; }); }).length;
}
var NET = {c: null, b: -1, ok: false};
function vagas() { return S.slots.slice(0, S.modo); }
function atual() { return S.fila[S.k]; }

// sorteia sem repetir: uma pergunta só volta depois que todas as outras do mesmo nível já saíram
function sortear(nivel) {
  var usadas; try { usadas = JSON.parse(localStorage.getItem('luzcerrado_usadas')) || []; } catch (e) { usadas = []; }
  var grupo = BANCO.filter(function (x) { return nivel === 'T' ? x.t : (!x.t && x.d === nivel); });
  var livres = grupo.filter(function (x) { return usadas.indexOf(x.q) < 0 && S.fila.every(function (f) { return f.it !== x; }); });
  if (!livres.length) {
    usadas = usadas.filter(function (q) { return !grupo.some(function (x) { return x.q === q; }); });
    livres = grupo.filter(function (x) { return S.fila.every(function (f) { return f.it !== x; }); });
  }
  var it = livres[Math.floor(Math.random() * livres.length)];
  usadas.push(it.q); try { localStorage.setItem('luzcerrado_usadas', JSON.stringify(usadas)); } catch (e) {}
  return it;

function sortearFoto(tipo) {
  var usadas; try { usadas = JSON.parse(localStorage.getItem('luzcerrado_fotos')) || []; } catch (e) { usadas = []; }

  var livres = FOTOS.filter(function (f) { return usadas.indexOf(f[0]) < 0 && !naFila(f) && IMG[f[0]]; });

  usadas.push(f[0]); try { localStorage.setItem('luzcerrado_fotos', JSON.stringify(usadas)); } catch (e) {}

}

  S.fila = [];

    niveis.forEach(function (nv) {
      var it = DESAFIO[nv] && nv !== 'T' ? sortearFoto(nv) : sortear(nv), ops = embaralhar(it.o.map(function (t, i) { return {t: t, ok: i === 0}; }));
      S.fila.push({e: e, it: it, ops: ops, certa: ops.findIndex(function (o) { return o.ok; })});
    });

}
function novoPalco(tipo, dur) { return {tipo: tipo, t0: Date.now(), dur: dur, f: Math.random() * 6, ox: 38 + Math.random() * 24, oy: 36 + Math.random() * 24, ordem: embaralhar(Array.from({length: 60}, function (_, i) { return i; })), rev: false}; }

/* ================= rede ================= */
function conectar(i) {
  if (typeof mqtt === 'undefined') return;
  var c, ok = false;
  try { c = mqtt.connect(BROKERS[i], {clientId: 'telao_' + codigo(8), keepalive: 30, reconnectPeriod: 2500, connectTimeout: 6000}); } catch (e) { return; }
  c.on('connect', function () {
    ok = true; NET.c = c; NET.b = i; NET.ok = true;
    c.subscribe('luzcerrado26/' + SALA + '/in'); rede(); if (S.fase === 'entrada') desenhar(); publicar();
  });
  c.on('close', function () { if (ok) { NET.ok = false; rede(); } });
  c.on('error', function () {});
  c.on('message', function (_, m) { try { receber(JSON.parse(m.toString())); } catch (e) {} });
  setTimeout(function () { if (!ok) { try { c.end(true); } catch (e) {} conectar((i + 1) % BROKERS.length); } }, 7000);
}
function rede() { $('rede').textContent = NET.ok ? '' : 'Sem conexão com os celulares (o teclado continua funcionando)'; }
function publicar() {
  if (!NET.ok) return;
  var a = atual(), susp = S.fase === 'resposta' && S.rev === 0, est = {f: susp ? 'pergunta' : S.fase, m: S.modo, k: S.k, n: S.fila.length,
    sl: vagas().map(function (j) { return j ? {id: j.id, n: j.n, p: susp ? j.p - j.g : j.p, a: j.a, g: j.g, ok: j.okUlt, nx: j.nx, pos: j.pos, c: j.c, tt: j.tt} : null; })};
  if (a && (S.fase === 'pergunta' || S.fase === 'resposta')) {
    est.q = a.it.q; est.o = a.ops.map(function (o) { return o.t; }); est.T = CFG.TEMPO; est.r = Math.max(0, (S.ate - Date.now()) / 1000); est.tes = !!a.it.t; est.d = a.it.d;
    if (a.it.foto) est.rot = DESAFIO[a.it.foto].nome;

setInterval(publicar, 1500);

function receber(m) {
  var j;
  if (m.t === 'h') { PRES[m.id] = Date.now(); return; }
  if (m.t === 'e') { PRES[m.id] = Date.now(); return reacao(m.e); }

    PRES[m.id] = Date.now();
    if (S.fase === 'pergunta' && m.k === S.k && !(m.id in S.resp) && m.o >= 0 && m.o < 4 && !S.slots.some(function (x) { return x && x.id === m.id; })) { S.resp[m.id] = m.o; attPlateia(); }
    return;

          j.c + ' de ' + S.fila.length + ' certas, ' + seg(j.tt) + ' respondendo.</div></div>';

/* ================= efeitos ================= */
function clarao(ruim) { var c = $('clarao'); c.className = ''; void c.offsetWidth; c.className = 'on' + (ruim ? ' ruim' : ''); }

// depois da resposta: vagalumes saem da alternativa certa (ou da foto) e voam até o placar de quem acertou
var VOOS = [];

      e2.classList.add('pulso'); bip(1500, .12, 'sine', .08); contar(e2.querySelector('.num'), j.p - j.g, j.p, 800);

(function () {
  var cv = $('motes'), cx = cv.getContext('2d'), W, H, ps = [];

  tam(); addEventListener('resize', tam);

      }

})();

/* ================= teclado ================= */
function teclado() {
  for (var i = 0; i < S.modo; i++) if (!S.slots[i]) {
    var n = prompt('Nome do jogador ' + (i + 1) + ' (teclado: ' + (i ? 'teclas 7, 8, 9 e 0' : 'teclas 1, 2, 3 e 4') + ' = A, B, C e D)');
    if (n === null) return;
    S.slots[i] = novoJog('kb' + i, n.trim().slice(0, 14) || 'Jogador ' + (i + 1));
  }
  desenhar(); publicar(); checarEntrada();
}
document.addEventListener('keydown', function (ev) {
  var k = ev.key, f = S.fase;
  if ($('lista').classList.contains('on')) {
    if (k === 'Escape' || k === 'l' || k === 'L' || k === 'c' || k === 'C') $('lista').classList.remove('on');
    else if (k === 'e' || k === 'E') exportar();
    else if (k === 'Delete' && ev.shiftKey && confirm('Apagar TODO o placar? Não dá para desfazer.')) { gravarPlacar([]); abrirLista(); if (f === 'abertura') desenhar(); }
    return;
  }
  if (k === 'm' || k === 'M') { mudo = !mudo; return; }
  if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); return; }
  if (k === 'p' || k === 'P') { S.plat = !S.plat; desenhar(); return; }
  if (f === 'abertura') {
    if (k === '1' || k === '2') irEntrada(+k);
    else if (k === 'l' || k === 'L') abrirLista();
    else if (k === 'c' || k === 'C') abrirCreditos();
  } else if (f === 'entrada') {
    if (k === 't' || k === 'T') teclado();
    else if (k === 'Escape') irAbertura();
  } else if (f === 'pergunta') {
    var i1 = '1234'.indexOf(k), i2 = '7890'.indexOf(k);
    if (i1 >= 0 && S.slots[0] && S.slots[0].kb) responder(S.slots[0], i1);
    if (i2 >= 0 && S.slots[1] && S.slots[1].kb) responder(S.slots[1], i2);
    if (k === 'Escape' && confirm('Encerrar esta partida?')) irAbertura();
  } else if (f === 'resposta') {
    if ((k === 'Enter' || k === ' ') && S.rev === 2) S.ate = Date.now();
    if (k === 'Escape' && confirm('Encerrar esta partida?')) irAbertura();
  } else if (f === 'final' && (k === 'Enter' || k === ' ' || k === 'Escape')) irAbertura();
});
